name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '8.15.0'

jobs:
  # ==================== LINT & TYPECHECK ====================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed BEFORE setup-node so `cache: pnpm` works.
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check API
        run: pnpm --filter @oblintz/api typecheck

      - name: Type check Web
        run: pnpm --filter @oblintz/web typecheck

      - name: Type check Admin
        run: pnpm --filter @oblintz/admin typecheck

  # ==================== TEST ====================
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oblintz_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/oblintz_test
      DATABASE_URL_TEST: postgresql://test:test@localhost:5432/oblintz_test
      REDIS_URL: redis://localhost:6379
      REDIS_URL_TEST: redis://localhost:6379
      JWT_ACCESS_SECRET: test-access-secret-key-min-32-chars!!
      JWT_REFRESH_SECRET: test-refresh-secret-key-min-32-chars!!
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate & migrate test DB
        run: |
          pnpm --filter @oblintz/api exec prisma generate
          pnpm --filter @oblintz/api exec prisma migrate deploy

      # Unit tests run once with coverage; thresholds (vitest.config.ts) fail on regression.
      - name: Unit tests + coverage gate
        run: pnpm --filter @oblintz/api test:coverage

      # Integration tests run against the real Postgres service.
      - name: Integration tests
        run: pnpm --filter @oblintz/api test:integration

  # ==================== BUILD ====================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @oblintz/api exec prisma generate

      - name: Build API
        run: pnpm --filter @oblintz/api build

      - name: Build Web
        run: pnpm --filter @oblintz/web build

      - name: Build Admin
        run: pnpm --filter @oblintz/admin build

  # ==================== DEPLOY ====================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/oblintz
            git pull origin main
            pnpm install --frozen-lockfile
            pnpm --filter @oblintz/api exec prisma generate
            pnpm --filter @oblintz/api exec prisma migrate deploy
            pnpm --filter @oblintz/api build
            pnpm --filter @oblintz/web build
            pnpm --filter @oblintz/admin build
            pm2 restart ecosystem.config.js
            echo "Deployment completed at $(date)"

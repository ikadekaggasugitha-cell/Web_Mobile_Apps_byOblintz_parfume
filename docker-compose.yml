# Local development services for OBLINTZ.
# Postgres 15 + Redis 7 per docs/02-architecture/Tech-Stack.md.
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:15-alpine
    container_name: oblintz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: oblintz
      POSTGRES_PASSWORD: password
      POSTGRES_DB: oblintz
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oblintz -d oblintz"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oblintz-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
